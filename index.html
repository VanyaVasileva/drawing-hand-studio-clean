<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Drawing Hand Studio</title>
<style>
:root{--bg:#fbfaf7;--card:#fff;--ink:#171717;--muted:#6f6f6f;--line:#e8e4de;--soft:#f2efe9}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:1040px;margin:0 auto;padding:28px 18px 70px}h1{font-size:clamp(30px,5vw,52px);line-height:1.02;margin:8px 0;letter-spacing:-.035em}.lead{color:var(--muted);font-size:18px;margin:0 0 22px}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:0 10px 30px rgba(0,0,0,.035);margin:14px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}@media(max-width:760px){.grid,.grid3{grid-template-columns:1fr}}label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}input[type=file]{width:100%;padding:14px;border:1px dashed #cfc9bf;border-radius:15px;background:#fcfbf8}input[type=range]{width:100%}.value{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}.seg{display:flex;gap:8px;flex-wrap:wrap}.seg button,.primary{border:1px solid var(--line);border-radius:12px;padding:10px 14px;background:#fff;font-weight:700;cursor:pointer}.seg button.active{background:#111;color:#fff;border-color:#111}.primary{width:100%;background:#111;color:#fff;border-color:#111;font-size:17px;padding:14px 16px}.primary:disabled{opacity:.4;cursor:not-allowed}.status{font-size:14px;color:var(--muted);min-height:22px;margin-top:10px}.preview{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(250px,.55fr);gap:16px;align-items:start}@media(max-width:760px){.preview{grid-template-columns:1fr}}video,canvas{width:100%;background:#111;border-radius:16px;display:block}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{padding:12px;border-radius:14px;background:var(--soft)}.stat b{display:block;font-size:19px}.tiny{font-size:12px;color:var(--muted)}.hide{display:none!important}.result a{display:inline-flex;text-decoration:none;color:#fff;background:#111;border-radius:12px;padding:11px 14px;font-weight:700;margin-top:10px}.note{padding:12px 14px;background:#f7f4ee;border-radius:14px;color:#59534b;font-size:13px}
</style>
</head>
<body>
<div class="wrap">
<h1>Let the hand follow your drawing.</h1>
<p class="lead">Upload a screen recording. Your built-in hand follows new drawing changes automatically.</p>
<div class="card"><label for="file">Drawing screen recording</label><input id="file" type="file" accept="video/mp4,video/quicktime,video/*" /></div>
<div id="work" class="hide">
<div class="card preview"><video id="source" playsinline controls></video><div><div class="stats"><div class="stat"><span class="tiny">Video</span><b id="size">—</b></div><div class="stat"><span class="tiny">Length</span><b id="duration">—</b></div></div><div class="note" style="margin-top:10px">Processing happens only in this browser. Nothing is uploaded to a server.</div></div></div>
<div class="card">
<div class="grid"><div><label>Hand</label><div class="seg" id="sideSeg"><button type="button" class="active" data-side="Right">Right hand</button><button type="button" data-side="Left">Left hand</button></div></div><div><label>Presentation</label><div class="seg" id="presetSeg"><button type="button" class="active" data-preset="source">Hand only</button><button type="button" data-preset="reel">iPad Reel</button><button type="button" data-preset="youtube">YouTube landscape</button></div></div></div>
<div class="grid3" style="margin-top:18px"><div><label>Hand size <span class="value" id="handSizeV">70%</span></label><input id="handSize" type="range" min="25" max="90" value="70"></div><div><label>Pencil tip X <span class="value" id="tipXV">14.8%</span></label><input id="tipX" type="range" min="0" max="40" step="0.1" value="14.8"></div><div><label>Pencil tip Y <span class="value" id="tipYV">34.4%</span></label><input id="tipY" type="range" min="0" max="70" step="0.1" value="34.4"></div></div>
<div class="grid3" style="margin-top:14px"><div><label>Move hand left/right <span class="value" id="offXV">0%</span></label><input id="offX" type="range" min="-25" max="25" step="0.5" value="0"></div><div><label>Move hand up/down <span class="value" id="offYV">0%</span></label><input id="offY" type="range" min="-25" max="25" step="0.5" value="0"></div><div><label>Tracking sensitivity <span class="value" id="sensV">24</span></label><input id="sensitivity" type="range" min="8" max="60" value="24"></div></div>
</div>
<div class="card"><button id="make" class="primary" type="button">Create hand-following video</button><div id="status" class="status"></div></div>
<div id="resultCard" class="card result hide"><h2 style="margin-top:0">Result</h2><video id="result" controls playsinline></video><a id="download" download>Download video</a><div class="tiny" style="margin-top:8px">The 0.07-second hand lead is built in.</div></div>
</div>
<canvas id="output" class="hide"></canvas><canvas id="track" class="hide"></canvas>
</div>
<script>
(()=>{'use strict';
const HAND_SRC='https://raw.githubusercontent.com/VanyaVasileva/drawing-hand-studio/main/assets/default_hand.png';
const fileInput=document.getElementById('file'),work=document.getElementById('work'),source=document.getElementById('source'),sizeEl=document.getElementById('size'),durationEl=document.getElementById('duration'),makeBtn=document.getElementById('make'),statusEl=document.getElementById('status'),resultCard=document.getElementById('resultCard'),resultVideo=document.getElementById('result'),download=document.getElementById('download'),output=document.getElementById('output'),outCtx=output.getContext('2d',{alpha:false}),track=document.getElementById('track'),trackCtx=track.getContext('2d',{willReadFrequently:true});
const controls={handSize:document.getElementById('handSize'),tipX:document.getElementById('tipX'),tipY:document.getElementById('tipY'),offX:document.getElementById('offX'),offY:document.getElementById('offY'),sensitivity:document.getElementById('sensitivity')};
const values={handSize:document.getElementById('handSizeV'),tipX:document.getElementById('tipXV'),tipY:document.getElementById('tipYV'),offX:document.getElementById('offXV'),offY:document.getElementById('offYV'),sensitivity:document.getElementById('sensV')};
let side='Right',preset='source',sourceUrl=null,resultUrl=null,busy=false,audioCtx=null,audioSource=null,audioDest=null;
function pct(v){return`${Number(v).toFixed(1).replace('.0','')}%`}function syncLabels(){values.handSize.textContent=pct(controls.handSize.value);values.tipX.textContent=pct(controls.tipX.value);values.tipY.textContent=pct(controls.tipY.value);values.offX.textContent=pct(controls.offX.value);values.offY.textContent=pct(controls.offY.value);values.sensitivity.textContent=controls.sensitivity.value}Object.values(controls).forEach(el=>el.addEventListener('input',syncLabels));syncLabels();
document.getElementById('sideSeg').addEventListener('click',e=>{const b=e.target.closest('button[data-side]');if(!b)return;side=b.dataset.side;[...b.parentNode.children].forEach(x=>x.classList.toggle('active',x===b))});
document.getElementById('presetSeg').addEventListener('click',e=>{const b=e.target.closest('button[data-preset]');if(!b)return;preset=b.dataset.preset;[...b.parentNode.children].forEach(x=>x.classList.toggle('active',x===b))});
fileInput.addEventListener('change',async()=>{const f=fileInput.files&&fileInput.files[0];if(!f)return;if(sourceUrl)URL.revokeObjectURL(sourceUrl);source.pause();source.removeAttribute('src');source.load();sourceUrl=URL.createObjectURL(f);work.classList.remove('hide');resultCard.classList.add('hide');sizeEl.textContent='Loading…';durationEl.textContent='—';const metadataReady=new Promise((resolve,reject)=>{const ready=()=>{cleanup();resolve()},fail=()=>{cleanup();reject(new Error('This video could not be opened.'))},cleanup=()=>{source.removeEventListener('loadedmetadata',ready);source.removeEventListener('error',fail)};source.addEventListener('loadedmetadata',ready,{once:true});source.addEventListener('error',fail,{once:true})});source.src=sourceUrl;source.load();try{await metadataReady;sizeEl.textContent=`${source.videoWidth} × ${source.videoHeight}`;durationEl.textContent=Number.isFinite(source.duration)?`${source.duration.toFixed(1)}s`:'—'}catch(err){sizeEl.textContent='Could not open';durationEl.textContent='—';statusEl.textContent=err.message}});
const handImg=new Image();handImg.crossOrigin='anonymous';handImg.src=HAND_SRC;const handReady=new Promise((resolve,reject)=>{handImg.onload=resolve;handImg.onerror=reject});
function chooseMime(){const types=['video/mp4;codecs="avc1.42E01E,mp4a.40.2"','video/mp4','video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'];return types.find(t=>window.MediaRecorder&&MediaRecorder.isTypeSupported(t))||''}
function outputSize(vw,vh){let w=vw,h=vh;if(preset==='reel'){const maxH=Math.min(1280,vh);h=maxH;w=Math.round(h*9/16)}else if(preset==='youtube'){const maxW=Math.min(1280,vw);w=maxW;h=Math.round(w*9/16)}else{const s=Math.min(1,1280/Math.max(vw,vh));w=Math.round(vw*s);h=Math.round(vh*s)}w=Math.max(2,w-w%2);h=Math.max(2,h-h%2);return[w,h]}
function drawFitted(ctx,img,w,h){const sw=img.videoWidth||img.width,sh=img.videoHeight||img.height,scale=Math.min(w/sw,h/sh),dw=sw*scale,dh=sh*scale,dx=(w-dw)/2,dy=(h-dh)/2;ctx.fillStyle='#000';ctx.fillRect(0,0,w,h);ctx.drawImage(img,dx,dy,dw,dh);return{dx,dy,dw,dh,sx:dw/sw,sy:dh/sh}}
function makeTracker(vw,vh){const tw=Math.min(260,vw),th=Math.max(2,Math.round(vh*tw/vw));track.width=tw;track.height=th;const history=[],baseline=new Float32Array(tw*th*3);let baseCount=0,tracked=null,idle=999;const candidates=[],histMax=6;function frame(){trackCtx.drawImage(source,0,0,tw,th);const cur=trackCtx.getImageData(0,0,tw,th).data,rgb=new Uint8ClampedArray(tw*th*3);for(let i=0,j=0;i<cur.length;i+=4){rgb[j++]=cur[i];rgb[j++]=cur[i+1];rgb[j++]=cur[i+2]}if(baseCount<8){for(let i=0;i<rgb.length;i++)baseline[i]=(baseline[i]*baseCount+rgb[i])/(baseCount+1);baseCount++;history.push(rgb);if(history.length>histMax)history.shift();return{tracked,idle}}history.push(rgb);if(history.length<=histMax)return{tracked,idle};const old=history.shift(),sens=Number(controls.sensitivity.value),guardTop=Math.max(1,Math.floor(th*.035)),guardSide=Math.max(1,Math.floor(tw*.018)),cell=18,cols=Math.ceil(tw/cell),counts=new Uint16Array(Math.ceil(th/cell)*cols),sumsX=new Float32Array(counts.length),sumsY=new Float32Array(counts.length),prevLocal=tracked?{x:tracked.x*tw/vw,y:tracked.y*th/vh}:null,maxJump=220*tw/vw;for(let y=guardTop;y<th;y++)for(let x=guardSide;x<tw-guardSide;x++){const p=(y*tw+x)*3,dr=Math.abs(rgb[p]-old[p]),dg=Math.abs(rgb[p+1]-old[p+1]),db=Math.abs(rgb[p+2]-old[p+2]),motion=Math.max(dr,dg,db);if(motion<sens)continue;const cb=(Math.abs(rgb[p]-baseline[p])+Math.abs(rgb[p+1]-baseline[p+1])+Math.abs(rgb[p+2]-baseline[p+2]))/3,ob=(Math.abs(old[p]-baseline[p])+Math.abs(old[p+1]-baseline[p+1])+Math.abs(old[p+2]-baseline[p+2]))/3,radial=cb-ob,primary=radial>Math.max(3,sens*.22),fallback=tracked&&Math.abs(radial)>Math.max(6,sens*.38);if(!primary&&!fallback)continue;if(prevLocal&&Math.hypot(x-prevLocal.x,y-prevLocal.y)>maxJump)continue;const ci=Math.floor(y/cell)*cols+Math.floor(x/cell);counts[ci]++;sumsX[ci]+=x;sumsY[ci]+=y}let best=-1,bestScore=-1e9;for(let i=0;i<counts.length;i++)if(counts[i]>=3){const cx=sumsX[i]/counts[i],cy=sumsY[i]/counts[i];let score=counts[i];if(prevLocal)score-=Math.hypot(cx-prevLocal.x,cy-prevLocal.y)*.07;if(score>bestScore){bestScore=score;best=i}}if(best>=0){let c={x:(sumsX[best]/counts[best])*vw/tw,y:(sumsY[best]/counts[best])*vh/th};candidates.push(c);if(candidates.length>5)candidates.shift();const xs=candidates.map(q=>q.x).sort((a,b)=>a-b),ys=candidates.map(q=>q.y).sort((a,b)=>a-b),m=Math.floor(xs.length/2);c={x:xs[m],y:ys[m]};if(!tracked)tracked=c;else{const dx=c.x-tracked.x,dy=c.y-tracked.y,d=Math.hypot(dx,dy),dead=Math.max(3,vw*.007);if(d>dead){const maxStep=Math.max(14,vw*.04),s=Math.min(1,maxStep/Math.max(d,.001)),alpha=.42;tracked={x:tracked.x*(1-alpha)+(tracked.x+dx*s)*alpha,y:tracked.y*(1-alpha)+(tracked.y+dy*s)*alpha}}idle=0}else idle++;return{tracked,idle}}return{frame}}
async function setupAudio(){if(!window.AudioContext&&!window.webkitAudioContext)return null;if(!audioCtx){const AC=window.AudioContext||window.webkitAudioContext;audioCtx=new AC();audioSource=audioCtx.createMediaElementSource(source);audioDest=audioCtx.createMediaStreamDestination();audioSource.connect(audioDest)}if(audioCtx.state==='suspended')await audioCtx.resume();return audioDest.stream}
async function run(){if(busy||!fileInput.files?.[0])return;if(!window.MediaRecorder||!output.captureStream){statusEl.textContent='This browser cannot export video from the page. Try Safari or Chrome on a current device.';return}busy=true;makeBtn.disabled=true;resultCard.classList.add('hide');statusEl.textContent='Preparing…';try{await handReady;source.pause();source.currentTime=0;await new Promise(r=>{if(source.readyState>=2)r();else source.onseeked=()=>r()});const vw=source.videoWidth,vh=source.videoHeight,[ow,oh]=outputSize(vw,vh);output.width=ow;output.height=oh;drawFitted(outCtx,source,ow,oh);const fps=30,leadFrames=Math.max(0,Math.round(fps*.07)),pool=Array.from({length:leadFrames+3},()=>{const c=document.createElement('canvas');c.width=ow;c.height=oh;return c}),tracker=makeTracker(vw,vh),canvasStream=output.captureStream(fps),audioStream=await setupAudio(),tracks=[...canvasStream.getVideoTracks(),...(audioStream?audioStream.getAudioTracks():[])],combined=new MediaStream(tracks),mime=chooseMime(),recorder=new MediaRecorder(combined,mime?{mimeType:mime,videoBitsPerSecond:8000000}:{}),chunks=[];recorder.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};const stopped=new Promise(resolve=>recorder.onstop=resolve);recorder.start(1000);let index=0,lastFit=null,lastTrack={tracked:null,idle:999};const frameInterval=1000/fps;function drawHand(point,fit){const handW=ow*(Number(controls.handSize.value)/100),handH=handW*(handImg.naturalHeight/handImg.naturalWidth),px=fit.dx+point.x*fit.sx+ow*(Number(controls.offX.value)/100),py=fit.dy+point.y*fit.sy+oh*(Number(controls.offY.value)/100);let tx=handW*(Number(controls.tipX.value)/100),ty=handH*(Number(controls.tipY.value)/100);outCtx.save();outCtx.globalAlpha=.96;if(side==='Left'){tx=handW-tx;const x=px-tx,y=py-ty;outCtx.translate(x+handW,y);outCtx.scale(-1,1);outCtx.drawImage(handImg,0,0,handW,handH)}else outCtx.drawImage(handImg,px-tx,py-ty,handW,handH);outCtx.restore()}async function onFrame(){if(source.ended)return;const slot=pool[index%pool.length],ctx=slot.getContext('2d',{alpha:false});lastFit=drawFitted(ctx,source,ow,oh);lastTrack=tracker.frame();if(index>=leadFrames){const old=pool[(index-leadFrames)%pool.length];outCtx.drawImage(old,0,0);if(lastTrack.tracked&&lastTrack.idle<=Math.max(12,Math.round(fps*.45)))drawHand(lastTrack.tracked,lastFit)}index++;statusEl.textContent=`Processing… ${Math.min(100,Math.round(source.currentTime/source.duration*100))}%`}let doneResolve;const playbackDone=new Promise(r=>doneResolve=r),cb=()=>{onFrame().finally(()=>{if(source.ended){doneResolve();return}if(source.requestVideoFrameCallback)source.requestVideoFrameCallback(cb);else requestAnimationFrame(cb)})};source.onended=()=>doneResolve();source.controls=false;source.muted=false;await source.play();if(source.requestVideoFrameCallback)source.requestVideoFrameCallback(cb);else requestAnimationFrame(cb);await playbackDone;for(let k=Math.max(0,index-leadFrames);k<index;k++){outCtx.drawImage(pool[k%pool.length],0,0);if(lastTrack.tracked&&lastTrack.idle<=Math.max(12,Math.round(fps*.45)))drawHand(lastTrack.tracked,lastFit);await new Promise(r=>setTimeout(r,frameInterval))}recorder.stop();await stopped;canvasStream.getTracks().forEach(t=>t.stop());source.controls=true;source.pause();const blob=new Blob(chunks,{type:recorder.mimeType||mime||'video/webm'});if(resultUrl)URL.revokeObjectURL(resultUrl);resultUrl=URL.createObjectURL(blob);resultVideo.src=resultUrl;const ext=blob.type.includes('mp4')?'mp4':'webm';download.href=resultUrl;download.download=`drawing-hand-${Date.now()}.${ext}`;download.textContent=`Download ${ext.toUpperCase()}`;resultCard.classList.remove('hide');statusEl.textContent='Finished.'}catch(err){console.error(err);statusEl.textContent=`Could not create the video: ${err?.message||err}`;source.controls=true}finally{busy=false;makeBtn.disabled=false}}
makeBtn.addEventListener('click',run);
})();
</script>
</body>
</html>
